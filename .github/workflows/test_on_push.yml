name: Run tests on any Push event
on:
  push:
    tags:
      - '!refs/tags/*'
    branches:
      - '*'
jobs:
  run_tests:
    runs-on: [ubuntu-latest]
    steps:
      # Чекаутим код
      - uses: actions/checkout@master
      # Устанавливаем python нужной версии
      - uses: actions/setup-python@v1
        with:
          python-version: '3.12.12'
          architecture: 'x64'
      - name: Install requirements
        run:
          pip install -r requirements.txt coverage pytest pre-commit &&
          pre-commit install
      - name: Run tests
        run: coverage run -m pytest tests/ -vv
      - name: Tests report
        run: coverage report -m && coverage xml
      - name: Install ruff (standalone)
        run: |
          curl -LsSf https://astral.sh/ruff/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .