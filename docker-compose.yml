version: '3.8'

services:
  # PostgreSQL база данных
  postgres:
    image: postgres:15-alpine
    container_name: telegram-bot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_bot_db}
      POSTGRES_USER: ${POSTGRES_USER:-bot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot_user}"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - bot-network

  bot-app:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file:
      - .env
    command: ["python3", "/src/cmd/bot/bot.py"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - bot-network

  server-app:
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - .env
    command: ["python3", "/src/cmd/server/server.py"]
    depends_on:
      - postgres
    networks:
      - bot-network

volumes:
  postgres_data:

networks:
  bot-network: